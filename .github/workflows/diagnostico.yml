name: Diagnóstico de redirecionamentos
on:
  push:
    branches: [main]
    paths: [".github/diagnostico-trigger"]
permissions:
  contents: write
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar URLs
        run: |
          out=content/diagnostico.txt
          : > $out
          for u in http://minutodereflexao.com/ https://www.minutodereflexao.com/ http://www.minutodereflexao.com/ https://minutodereflexao.com/ https://minutodereflexao.com/blog https://minutodereflexao.com/blog/como-parar-de-procrastinar https://effervescent-madeleine-77e208.netlify.app/ https://minutodereflexao.com/index.html; do
            echo "== $u" >> $out
            curl -s -o /dev/null -I -w "%{http_code} -> %{redirect_url}\n" "$u" >> $out
          done
          echo "== URLs do sitemap" >> $out
          curl -s https://minutodereflexao.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | while read u; do
            echo "$(curl -s -o /dev/null -I -w '%{http_code} -> %{redirect_url}' "$u") $u" >> $out
          done
          cat $out
          git config user.name "Thiago Fernandes"; git config user.email "thiagofercon@gmail.com"
          git add $out && git commit -m "Diagnóstico de redirecionamentos" && git push
