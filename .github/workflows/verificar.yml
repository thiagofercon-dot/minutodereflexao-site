name: Verificar site
on:
  push:
    branches: [main]
    paths: [".github/verificar-trigger"]
permissions:
  contents: write
concurrency: verificar
jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Esperar publicação
        run: sleep 20
      - name: Cabeçalhos, redirecionamentos e arquivos internos
        run: |
          out=content/verificacao.txt; : > $out
          echo "IP: $(getent hosts minutodereflexao.com)" >> $out
          echo "versao publicada: $(curl -s https://minutodereflexao.com/versao.txt) / main: $GITHUB_SHA" >> $out
          for u in https://minutodereflexao.com/ http://minutodereflexao.com/ https://www.minutodereflexao.com/blog/ https://minutodereflexao.com/blog; do
            echo "== $u" >> $out; curl -sI "$u" | grep -iE '^(HTTP|location|server|content-security|x-frame|x-content|referrer|permissions|strict)' | cut -c1-140 >> $out; done
          for u in blog/como-manter-a-motivacao/ blog/como-ter-mais-autoconfianca/ guias/gestao-do-tempo/ assets/ebooks/gestao-do-tempo.jpg assets/thiago-fernandes.jpg blog/tema/proposito/ sitemap.xml pagina-que-nao-existe/ .git/config .htaccess build.py; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' https://minutodereflexao.com/$u) /$u" >> $out; done
          echo "formulario GET: $(curl -s -o /dev/null -w '%{http_code}' https://minutodereflexao.com/contato/enviar.php)" >> $out
          echo "formulario robo: $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -d 'empresa=x' https://minutodereflexao.com/contato/enviar.php)" >> $out
      - name: Testar páginas no navegador (bloqueios da política de segurança)
        continue-on-error: true
        run: |
          npm i -s playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > check.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const ctx = await b.newContext();
            await ctx.addInitScript(() => { try { localStorage.setItem('mdr_consent', 'granted'); } catch (e) {} });
            const pages = ['/', '/blog/', '/blog/como-parar-de-procrastinar/', '/guias/gestao-do-tempo/', '/contato/'];
            for (const u of pages) {
              const p = await ctx.newPage(); const erros = [];
              p.on('console', m => { if (/Content Security Policy|Refused to/i.test(m.text())) erros.push(m.text().slice(0, 220)); });
              await p.goto('https://minutodereflexao.com' + u, { waitUntil: 'networkidle' });
              await p.waitForTimeout(2500);
              const st = await p.evaluate(() => ({ gtag: typeof window.gtag, fbq: typeof window.fbq, ga: !!window.google_tag_manager }));
              console.log(`${u} gtag=${st.gtag} gtm=${st.ga} fbq=${st.fbq} bloqueios=${erros.length}`);
              erros.forEach(e => console.log('   ' + e));
              await p.close();
            }
            await b.close();
          })();
          JS
          node check.js 2>&1 | tail -30 | tee -a content/verificacao.txt
      - name: Salvar resultado
        if: always()
        run: |
          git config user.name "Thiago Fernandes"; git config user.email "thiagofercon@gmail.com"
          git add content/verificacao.txt && git commit -m "Verificação do site" && git pull --rebase && git push
