[build]
  command = "python3 build.py"
  publish = "site"
  # Só publica quando algo do site mudou (economiza publicações do plano gratuito)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- build.py static content/articles content/guias netlify.toml"

# Endereço técnico do Netlify redireciona para o domínio oficial (evita conteúdo duplicado no Google)
[[redirects]]
  from = "https://effervescent-madeleine-77e208.netlify.app/*"
  to = "https://minutodereflexao.com/:splat"
  status = 301
  force = true

# http://www vai direto para o domínio oficial em um único salto
[[redirects]]
  from = "http://www.minutodereflexao.com/*"
  to = "https://minutodereflexao.com/:splat"
  status = 301
  force = true
